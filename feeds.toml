# Bronnenlijst voor ~/nieuws
#
# Elke [[rubriek]] wordt een kop op de site.
# Voeg een bron toe door een regel { naam = "...", url = "..." } toe te voegen.
# Werkt een feed niet (meer)? Dan wordt hij overgeslagen; de rest gaat gewoon door.
#
# Hoeveel tekst je van een bron toont, bepaal je met tekst = "...":
#   "kop"          alleen de kop + link naar de bron (standaard; veilig voor elke bron)
#   "samenvatting" kop + korte samenvatting uit de feed (alleen als de bron dat toestaat)
#   "volledig"     de hele tekst op je eigen pagina (alleen bij een open licentie,
#                  zet dan ook licentie = "..." erbij voor de bronvermelding)

# Filter voor dingen die geen nieuws zijn (puzzels, recepten, horoscopen…).
# negeer_url:   berichten waarvan de link dit stukje bevat, worden overgeslagen.
# negeer_titel: berichten waarvan de kop hierop past (hoofdletters maken niet uit).
# negeer_categorie: berichten met deze rubriek in de feed (bijv. NRC's columns).
#               ^ = begin van de kop, $ = einde, | = of.
[filter]
negeer_url = [
  "/puzzels/", "/puzzel/", "/spellen/", "/games/", "/horoscoop", "/recept",
  "/podcast", "/advertorial", "/partnercontent", "/partner-content", "/cartoon",
]
negeer_categorie = [
  "De puzzels van vandaag", "Ondertussen", "Opinie & columns", "Leven",
  "Carrière", "In Beeld", "Media", "Cultuur uitgelicht",
]
negeer_titel = [
  "^(sudoku|woordzoeker|kruiswoord|cryptogram)\\b",
  "^(column|recept|horoscoop|podcast)\\b",
]

[[rubriek]]
id = "binnenland"
titel = "binnenland"
bronnen = [
  # Open licentie (CC0): volledige tekst mag op je eigen site.
  { naam = "Rijksoverheid", url = "https://feeds.rijksoverheid.nl/nieuws.rss", tekst = "volledig", licentie = "CC0" },
  # NOS staat koppen met bronvermelding toe; de rest alleen kop uit voorzorg.
  { naam = "NOS",        url = "https://feeds.nos.nl/nosnieuwsbinnenland" },
  { naam = "NU.nl",      url = "https://www.nu.nl/rss/Algemeen" },
  { naam = "RTL Nieuws", url = "https://www.rtlnieuws.nl/rss.xml" },
  { naam = "Volkskrant", url = "https://www.volkskrant.nl/nieuws-achtergrond/rss.xml" },
  { naam = "Trouw",      url = "https://www.trouw.nl/nieuws/rss.xml" },
  { naam = "AD",         url = "https://www.ad.nl/home/rss.xml" },
  # NRC heeft één feed voor alles; alleen_categorie houdt alleen deze rubrieken over.
  { naam = "NRC",        url = "https://www.nrc.nl/rss/", alleen_categorie = ["Binnenland", "Politiek Den Haag", "Vandaag", "Economie"] },
]

[[rubriek]]
id = "buitenland"
titel = "buitenland"
bronnen = [
  { naam = "NOS",         url = "https://feeds.nos.nl/nosnieuwsbuitenland" },
  { naam = "NRC",         url = "https://www.nrc.nl/rss/", alleen_categorie = ["Buitenland"] },
  # Open licentie (CC BY): volledige tekst mag, met naam van auteur en link.
  { naam = "Global Voices", url = "https://globalvoices.org/feed/", tekst = "volledig", licentie = "CC BY 3.0" },
  { naam = "BBC",         url = "https://feeds.bbci.co.uk/news/world/rss.xml" },
  { naam = "The Guardian",url = "https://www.theguardian.com/world/rss" },
  { naam = "Al Jazeera",  url = "https://www.aljazeera.com/xml/rss/all.xml" },
  { naam = "DW",          url = "https://rss.dw.com/rdf/rss-en-world" },
  { naam = "France 24",   url = "https://www.france24.com/en/rss" },
  { naam = "NPR",         url = "https://feeds.npr.org/1004/rss.xml" },
]

