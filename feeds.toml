# Bronnenlijst voor ~/nieuws
#
# Elke [[rubriek]] wordt een kop op de site.
# Voeg een bron toe door een regel { naam = "...", url = "..." } toe te voegen.
# Werkt een feed niet (meer)? Dan wordt hij overgeslagen; de rest gaat gewoon door.

[[rubriek]]
id = "binnenland"
titel = "binnenland"
bronnen = [
  { naam = "NOS",        url = "https://feeds.nos.nl/nosnieuwsbinnenland" },
  { naam = "NU.nl",      url = "https://www.nu.nl/rss/Algemeen" },
  { naam = "RTL Nieuws", url = "https://www.rtlnieuws.nl/rss.xml" },
  { naam = "Volkskrant", url = "https://www.volkskrant.nl/nieuws-achtergrond/rss.xml" },
  { naam = "Trouw",      url = "https://www.trouw.nl/nieuws/rss.xml" },
  { naam = "AD",         url = "https://www.ad.nl/home/rss.xml" },
  { naam = "NRC",        url = "https://www.nrc.nl/rss/" },
]

